<!doctype html>
<html lang="en">

<title>Golf R vs Audi S3</title>

</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
/* =====================================================================

   by frame on a canvas. drawFrame(t) is a pure function of time t. Every

const cv = document.getElementById('c');
const main = cv.getContext('2d');

};
// Isle of Man Green metallic, the G90 launch colour


/* ---------- maths & easing ---------- */

/* ---------- voiceover timing (laid out by voiceover.py; estimated when previewing without a build) ---------- */
const VO = {};
{
  let t = 0;

    const tm = VOT[l.id], d = tm || { on: 0.25, off: 0.25 + l.text.split(' ').length * 0.34 };

}

const SPOKEN = { 'Volkswagen': 12, '2.0-litre': 13, '333': 32, '0–62': 20, '4.6': 16, '4.7': 16, 'S3': 8, 'R': 3, 'R-Performance': 16, '£47k': 20 };
function wordTimes(l) {

/* ---------- overlays ---------- */
const grainCv = document.createElement('canvas');

{
  const g = grainCv.getContext('2d'), id = g.createImageData(256, 256), r = rng(99);
  for (let i = 0; i < id.data.length; i += 4) { const v = Math.floor(r() * 255); id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }

}
function grain(t, a = 0.045) {

// 2 · TWINS — same platform, same numbers, torque to either rear wheel
function topDiagram(x, y, t, a, t0) { // drivetrain from above, torque pulsing to each rear wheel
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y);
  ctx.strokeStyle = 'rgba(160,200,255,0.7)'; ctx.lineWidth = 2.5;
  ctx.stroke(roundPoly([[-230, -90], [200, -90], [250, -60], [250, 60], [200, 90], [-230, 90]], 30));
  const wheels = [[-150, -100], [-150, 100], [170, -100], [170, 100]];
  const sideBias = Math.sin((t - t0) * 4.2);
  wheels.forEach(([wx, wy], i) => {
    const rear = i < 2, v = rear ? clamp(0.5 + (i === 0 ? -sideBias : sideBias) * 0.5) : 0.35;
    ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(wx - 36, wy - 14, 72, 28);
    ctx.fillStyle = rear ? (v > 0.6 ? C.amber : C.vw) : 'rgba(160,200,255,0.6)'; ctx.fillRect(wx - 36, wy - 14, 72 * v, 28);
  });
  ctx.strokeStyle = 'rgba(160,200,255,0.5)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(170, -86); ctx.lineTo(170, 86); ctx.moveTo(170, 0); ctx.lineTo(-150, 0); ctx.moveTo(-150, -86); ctx.lineTo(-150, 86); ctx.stroke();
  ctx.fillStyle = C.amber; ctx.fillRect(130, -30, 80, 60);                     // engine
  ctx.restore();
  flow([[x + 170, y], [x - 150, y]], t, 'rgba(255,190,90,A)', 6, 1.4, 5, a);
  flow([[x - 150, y], [x - 150, y - 86]], t, 'rgba(255,190,90,A)', 4, 1.2, 5, a * clamp(0.5 - sideBias * 0.6));
  flow([[x - 150, y], [x - 150, y + 86]], t, 'rgba(255,190,90,A)', 4, 1.2, 5, a * clamp(0.5 + sideBias * 0.6));
}

// 3 · DRAG RACE — 0–62 mph
function sRace(t) {
  ctx.fillStyle = '#05070b'; ctx.fillRect(0, 0, W, H);
  header(t, CUT[2] + 0.1, CUT[3], '0–62 mph');
  const r0 = B.race, run = 2.5;                       // 4.7 s of car time in 2.5 s
  const tau = Math.max(0, (t - r0) / run * 4.7);
  const lanes = [['golf', 420, 4.6, C.vw, '#cfe0ff'], ['audi', 760, 4.7, C.audi, '#ffd0c8']];
  const fin = 1300, x0 = 140, xF = fin - 250; // car x is its centre; its nose crosses the line at xF
  ctx.fillStyle = '#0c0e12'; ctx.fillRect(0, 300, W, 560);
  ctx.save(); ctx.setLineDash([60, 40]); ctx.lineDashOffset = -t * 900 * clamp(tau / 2); ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(0, 590); ctx.lineTo(W, 590); ctx.stroke(); ctx.restore();
  for (let k = 0; k < 14; k++) { ctx.fillStyle = k % 2 ? '#fff' : '#111'; ctx.fillRect(fin, 300 + k * 40, 20, 40); ctx.fillStyle = k % 2 ? '#111' : '#fff'; ctx.fillRect(fin + 20, 300 + k * 40, 20, 40); }
  speedLines(t, clamp(tau / 3) * 0.6, 21, 320, 840, -1);
  lanes.forEach(([which, gy, tF, col, light]) => {
    const u = Math.min(tau / tF, 1.6);
    const x = u <= 1 ? x0 + (xF - x0) * u * u : xF + 170 * eOC(clamp((u - 1) / 0.6)); // coast to a stop past the line
    drawSideCar(which, x - 500 * 0.5, gy, 0.5, { rot: tau * 30, blur: clamp(tau / 2.5), lights: 1, beam: 0.5 });
    const done = tau >= tF, shown = Math.min(tau, tF);
    const pop = done ? eOB(prog(tau, tF, tF + 0.4)) : 1;
    ctx.save(); ctx.translate(1830, gy - 60); const sc = lerp(1.25, 1, clamp(pop)); ctx.scale(sc, sc);
    text(shown.toFixed(1), 0, 0, { a: 'right', s: 110, w: 900, c: done ? '#fff' : light, glow: done ? col : null, gb: 30 });
    text('s', 8, 0, { s: 44, w: 800, c: col });
    text(which === 'golf' ? 'GOLF R' : 'AUDI S3', 0, 40, { a: 'right', s: 24, w: 800, c: col, ls: 5 });
    ctx.restore();
    if (done) ringBurst(1740, gy - 90, t, r0 + tF / 4.7 * run, which === 'golf' ? '120,175,255' : '255,130,110', 220, 2, 14);
  });
  if (tau >= 4.6) line('A TENTH APART', 960, 250, t, r0 + run * 4.6 / 4.7, 999, { a: 'center', s: 40, w: 900, ls: 8, c: C.amber });
}

// 4 · GOLF — the hooligan, Drift mode
function sGolf(t) {
  const t0 = CUT[3];
  ctx.fillStyle = '#0e1013'; ctx.fillRect(0, 0, W, H); // asphalt from above
  const r = rng(8);
  for (let i = 0; i < 400; i++) { ctx.fillStyle = `rgba(255,255,255,${0.02 + r() * 0.03})`; ctx.fillRect(r() * W, r() * H, 2, 2); }
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 3; ctx.setLineDash([40, 30]);
  ctx.beginPath(); ctx.arc(960, 560, 330, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
  const drifting = t >= B.drift;
  const ang = (t - t0) * (drifting ? 2.6 : 1.2) - 1.2, rad = drifting ? 300 : 330;
  const cx = 960 + Math.cos(ang) * rad, cy = 560 + Math.sin(ang) * rad * 0.62;
  const heading = ang + Math.PI / 2 + (drifting ? 0.85 * clamp((t - B.drift) * 3) : 0.05);
  if (drifting) { // tyre smoke and black marks
    ctx.save();
    for (let k = 0; k < 40; k++) {
      const a2 = ang - k * 0.05, age = k / 40;
      const px = 960 + Math.cos(a2) * rad, py = 560 + Math.sin(a2) * rad * 0.62;
      if (a2 < (B.drift - t0) * 2.6 - 1.2) break;
      ctx.fillStyle = `rgba(10,10,10,${0.35 * (1 - age)})`; ctx.fillRect(px - 6, py - 6, 12, 12);
      glowDot(px + Math.sin(k * 3.1) * 30, py + Math.cos(k * 2.3) * 20, 40 + age * 90, '200,205,215', 0.18 * (1 - age));
    }
    ctx.restore();
  }
  drawGolfTop(cx, cy, heading, 0.8);
  header(t, t0 + 0.1, CUT[4], 'Golf R');
  line('THE HOOLIGAN', 120, 210, t, B.hoolig, 999, { s: 70, w: 900, c: '#fff', glow: 'rgba(80,150,255,0.6)' });
  bgType('HOOLIGAN ·', 980, t, 120, 0.04, 260);

    const p = eOB(prog(t, B.pack, B.pack + 0.3));
    ctx.save(); ctx.translate(120, 280); ctx.scale(clamp(p, 0, 1.2), clamp(p, 0, 1.2));
    ctx.fillStyle = 'rgba(61,139,255,0.18)'; ctx.strokeStyle = C.vw; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(0, 0, 400, 56, 28); ctx.fill(); ctx.stroke();
    text('+ R-PERFORMANCE PACK', 200, 37, { a: 'center', s: 24, w: 800, c: '#cfe0ff', ls: 3 });
    ctx.restore();
  }
  // drive-mode selector
  const modes = ['COMFORT', 'SPORT', 'RACE', 'SPECIAL', 'DRIFT'];
  const sel = t < B.pack ? 1 : t < B.drift ? 1 + Math.min(3, Math.floor((t - B.pack) / Math.max(0.15, (B.drift - B.pack) / 3))) : 4;
  const px = 1580, py = 300;
  ctx.save(); ctx.globalAlpha = prog(t, t0 + 0.2, t0 + 0.5);
  ctx.fillStyle = 'rgba(5,8,14,0.8)'; ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(px - 190, py - 150, 380, 330, 24); ctx.fill(); ctx.stroke();
  text('DRIVING PROFILE', px, py - 110, { a: 'center', s: 18, w: 700, c: C.mute, ls: 4 });
  modes.forEach((m, i) => {
    const on = i === sel, y = py - 60 + i * 50;
    if (on) { ctx.fillStyle = i === 4 ? 'rgba(255,178,74,0.25)' : 'rgba(61,139,255,0.25)'; ctx.fillRect(px - 170, y - 34, 340, 46); }
    text(m, px, y, { a: 'center', s: on ? 34 : 26, w: on ? 900 : 600, c: on ? (i === 4 ? C.amber : '#fff') : C.dim, ls: 4 });
  });
  ctx.restore();
  if (drifting) { ringBurst(px, py + 140, t, B.drift, '255,178,74', 260, 2, 16); flash(t, B.drift, 0.25, 0.25, '255,200,120'); }
}

// 6 · BOOT — litres, then the Golf R Estate

  const t0 = CUT[5];

// 9 · CTA + END CARD
function sCTA(t) {
  const t0 = CUT[8];
  ctx.fillStyle = '#04050a'; ctx.fillRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, W, 0); g.addColorStop(0, 'rgba(40,90,200,0.25)'); g.addColorStop(0.5, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(200,40,40,0.25)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const a = prog(t, t0, t0 + 0.4);
  ctx.save(); ctx.globalAlpha = a;
  drawGolfFront(560, 640, 0.56, { drl: 1, beam: 0.6, flare: 0.4 });
  drawAudiFront(1360, 640, 0.56, { drl: 1, beam: 0.6, flare: 0.4 });
  ctx.restore();
  vsBadge(t, t0 + 0.2, 960, 420, 0.8);
  line('WHICH ONE ARE YOU TAKING?', 960, 150, t, ON('11'), 999, { a: 'center', s: 72, w: 900, ls: 2 });
  // live-poll style bars
  const p = eOC(prog(t, ON('11') + 0.4, ON('11') + 1.8)), pg = 0.5 + Math.sin(t * 2.1) * 0.06 * p;
  ctx.save(); ctx.globalAlpha = prog(t, ON('11') + 0.3, ON('11') + 0.6);
  ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(560, 720, 800, 22);
  ctx.fillStyle = C.vw; ctx.fillRect(560, 720, 800 * pg * p, 22);
  ctx.fillStyle = C.audi; ctx.fillRect(560 + 800 * (1 - (1 - pg) * p), 720, 800 * (1 - pg) * p, 22);
  text('GOLF R', 560, 706, { s: 22, w: 800, c: '#9fc3ff', ls: 4 }); text('AUDI S3', 1360, 706, { a: 'right', s: 22, w: 800, c: '#ffb3a8', ls: 4 });
  ctx.restore();
  if (t > B.comments - 0.1) {
    const q = eOB(prog(t, B.comments, B.comments + 0.35));
    ctx.save(); ctx.translate(960, 820); ctx.scale(clamp(q, 0, 1.2), clamp(q, 0, 1.2));
    ctx.fillStyle = C.go; ctx.beginPath(); ctx.roundRect(-210, -36, 420, 64, 32); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-150, 26); ctx.lineTo(-170, 52); ctx.lineTo(-120, 28); ctx.fill();
    text('TELL US IN THE COMMENTS', 0, 8, { a: 'center', s: 24, w: 900, c: '#062012', ls: 2 });
    ctx.restore();
  }
  line('Figures: manufacturer data and UK list prices, 2025. Independent film, not affiliated with or endorsed by Volkswagen or Audi.', 960, 1048, t, OFF('11') + 0.2, 999, { a: 'center', s: 18, w: 500, c: C.dim, st: 0.006, d: 0.3 });
}

/* =====================================================================
   COMPOSITOR — scene buffers, camera moves, transitions, HUD
   ===================================================================== */
const SCENES = [sHook, sTwins, sRace, sGolf, sAudi, sBoot, sPrice, sVerdict, sCTA].map((fn, i) => [CUT[i], CUT[i + 1], fn]);
const TRANS = [null, 'zoom', 'whip', 'stripe', 'whip', 'stripe', 'zoom', 'stripe', 'whip'];
const TR = 0.2;
const PUNCH = [[B.golf, 0.03], [B.audi, 0.03], [B.vs, 0.08], [B.twins, 0.04], [B.race + 2.45, 0.05], [B.drift, 0.07], [B.premium, 0.03], [B.saloon, 0.03], [B.estate, 0.03], [B.prices, 0.04], [B.vGolf, 0.05], [B.vAudi, 0.05], [B.comments, 0.03]];
const mkBuf = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return [c, c.getContext('2d')]; };
const [bufA, ctxA] = mkBuf(), [bufB, ctxB] = mkBuf();
function renderScene(target, i, t) {
  const prev = ctx; ctx = target;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  SCENES[i][2](t);
  ctx.restore(); ctx = prev;
}
function camera(i, t) {
  const u = prog(t, SCENES[i][0], SCENES[i][1]);
  let z = 1 + 0.035 * eIOS(u), x = Math.sin(t * 0.7 + i * 1.3) * 7, y = Math.cos(t * 0.5 + i) * 4, r = 0;
  for (const [t0, amp] of PUNCH) {
    if (t < t0 || t > t0 + 1.5) continue;
    const d = Math.exp(-(t - t0) * 6), n = rng(Math.floor(t * 60) + 7);
    z += amp * d; x += (n() - 0.5) * 260 * amp * d; y += (n() - 0.5) * 200 * amp * d; r += (n() - 0.5) * 0.05 * amp * d;
  }
  return { z, x, y, r };
}
function blit(buf, c, alpha = 1, dx = 0) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(W / 2 + c.x + dx, H / 2 + c.y); ctx.rotate(c.r); ctx.scale(c.z, c.z);
  ctx.drawImage(buf, -W / 2, -H / 2);
  ctx.restore();
}
function hud(t) {
  const a = 0.6 * prog(t, 0.5, 1.1) * (1 - prog(t, DURATION - 2.2, DURATION - 1.8));
  hudCorners(a);
  if (a > 0) text(`R vs S3   ${t.toFixed(1).padStart(4, '0')}`, W - 104, 70, { a: 'right', s: 17, w: 600, f: 'JetBrains Mono', c: 'rgba(255,255,255,0.45)', al: a * 1.6 });
}
function drawFrame(t) {
  ctx = main;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  let i = SCENES.findIndex(([a, b]) => t >= a && t < b);
  if (i < 0) i = SCENES.length - 1;
  let j = -1, p = 0;
  if (i > 0 && t - SCENES[i][0] < TR) { j = i; p = 0.5 + (t - SCENES[i][0]) / (2 * TR); }
  else if (i < SCENES.length - 1 && SCENES[i][1] - t < TR) { j = i + 1; p = 0.5 - (SCENES[i][1] - t) / (2 * TR); }
  if (j < 0) {
    renderScene(ctxA, i, t); blit(bufA, camera(i, t));
  } else {
    const c = SCENES[j][0], tOut = Math.min(t, c - 0.001), tIn = Math.max(t, c);
    renderScene(ctxA, j - 1, tOut); renderScene(ctxB, j, tIn);
    const cOut = camera(j - 1, tOut), cIn = camera(j, tIn), type = TRANS[j];
    if (type === 'whip') {
      const off = eIOC(p) * W, v = Math.sin(Math.PI * p);
      for (let k = 4; k >= 0; k--) blit(bufA, cOut, k ? 0.2 * v : 1, -off + k * 45 * v);
      for (let k = 4; k >= 0; k--) blit(bufB, cIn, k ? 0.2 * v : 1, W - off + k * 45 * v);
    } else if (type === 'zoom') {
      if (p < 0.5) blit(bufA, { ...cOut, z: cOut.z * (1 + 0.35 * eIC(p * 2)) });
      else blit(bufB, { ...cIn, z: cIn.z * (1.3 - 0.3 * eOC((p - 0.5) * 2)) });
      ctx.fillStyle = `rgba(255,255,255,${0.8 * Math.pow(1 - Math.abs(p - 0.5) * 2, 2)})`; ctx.fillRect(0, 0, W, H);
    } else { // blue / white / red stripe wipe
      blit(bufA, cOut);
      const x = lerp(-300, W + 900, eIOC(p)), sl = 0.42;
      ctx.save(); ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(x - 140, 0); ctx.lineTo(x - 140 - H * sl, H); ctx.lineTo(-10, H); ctx.closePath(); ctx.clip();
      blit(bufB, cIn); ctx.restore();
      [C.audi, '#e8ebf0', C.vw].forEach((col, k) => {
        const x0 = x - k * 70; ctx.fillStyle = col;
        ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0 + 60, 0); ctx.lineTo(x0 + 60 - H * sl, H); ctx.lineTo(x0 - H * sl, H); ctx.closePath(); ctx.fill();
      });
    }
  }
  captions(t);
  hud(t);
  vignette(0.55);
  grain(t, 0.04);
  black(prog(t, DURATION - 0.6, DURATION));
  black(1 - prog(t, 0, 0.25));
  ctx.restore();
}
window.drawFrame = drawFrame;
window.DURATION = DURATION;

if (!location.hash.includes('render')) {
  const start = performance.now() - (parseFloat(new URLSearchParams(location.search).get('t')) || 0) * 1000;
  const loop = () => { drawFrame(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}

</script>
</body>
