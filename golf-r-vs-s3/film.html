/* =====================================================================
   COMPOSITOR — scene buffers, camera moves, transitions, HUD
   ===================================================================== */
const SCENES = [sHook, sTwins, sRace, sGolf, sAudi, sBoot, sPrice, sVerdict, sCTA].map((fn, i) => [CUT[i], CUT[i + 1], fn]);
const TRANS = [null, 'zoom', 'whip', 'stripe', 'whip', 'stripe', 'zoom', 'stripe', 'whip'];
const TR = 0.2;
const PUNCH = [[B.golf, 0.03], [B.audi, 0.03], [B.vs, 0.08], [B.twins, 0.05], [B.turbo, 0.03], [B.g46, 0.05], [B.s47, 0.05], [B.tenth, 0.04], [B.pack, 0.03], [B.drift, 0.09],
  [B.classier, 0.03], [B.sportback, 0.03], [B.estate, 0.04], [B.dog, 0.02], [B.prices, 0.04], [B.vGolf, 0.05], [B.vAudi, 0.05], [B.comments, 0.03]];
const mkBuf = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return [c, c.getContext('2d')]; };
const [bufA, ctxA] = mkBuf(), [bufB, ctxB] = mkBuf();
function renderScene(target, i, t) {
  const prev = ctx; ctx = target;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  SCENES[i][2](t);
  ctx.restore(); ctx = prev;
}
function camera(i, t) {
  const u = prog(t, SCENES[i][0], SCENES[i][1]);
  let z = 1 + 0.03 * eIOS(u), x = Math.sin(t * 0.7 + i * 1.3) * 6, y = Math.cos(t * 0.5 + i) * 4, r = 0;
  for (const [t0, amp] of PUNCH) {
    if (t < t0 || t > t0 + 1.5) continue;
    const d = Math.exp(-(t - t0) * 6), n = rng(Math.floor(t * 60) + 7);
    z += amp * d; x += (n() - 0.5) * 260 * amp * d; y += (n() - 0.5) * 200 * amp * d; r += (n() - 0.5) * 0.05 * amp * d;
  }
  return { z, x, y, r };
}
function blit(buf, c, alpha = 1, dx = 0) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(W / 2 + c.x + dx, H / 2 + c.y); ctx.rotate(c.r); ctx.scale(c.z, c.z);
  ctx.drawImage(buf, -W / 2, -H / 2);
  ctx.restore();
}
function hud(t) {
  const a = 0.6 * prog(t, 0.5, 1.1) * (1 - prog(t, DURATION - 2.2, DURATION - 1.8));
  hudCorners(a);
  if (a > 0) text(`R vs S3   ${t.toFixed(1).padStart(4, '0')}`, W - 104, 70, { a: 'right', s: 17, w: 600, f: 'JetBrains Mono', c: 'rgba(255,255,255,0.55)', al: a * 1.6 });
}
function drawFrame(t) {
  ctx = main;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  let i = SCENES.findIndex(([a, b]) => t >= a && t < b);
  if (i < 0) i = SCENES.length - 1;
  let j = -1, p = 0;
  if (i > 0 && t - SCENES[i][0] < TR) { j = i; p = 0.5 + (t - SCENES[i][0]) / (2 * TR); }
  else if (i < SCENES.length - 1 && SCENES[i][1] - t < TR) { j = i + 1; p = 0.5 - (SCENES[i][1] - t) / (2 * TR); }
  if (j < 0) {
    renderScene(ctxA, i, t); blit(bufA, camera(i, t));
  } else {
    const c = SCENES[j][0], tOut = Math.min(t, c - 0.001), tIn = Math.max(t, c);
    renderScene(ctxA, j - 1, tOut); renderScene(ctxB, j, tIn);
    const cOut = camera(j - 1, tOut), cIn = camera(j, tIn), type = TRANS[j];
    if (type === 'whip') {
      const off = eIOC(p) * W, v = Math.sin(Math.PI * p);
      for (let k = 4; k >= 0; k--) blit(bufA, cOut, k ? 0.2 * v : 1, -off + k * 45 * v);
      for (let k = 4; k >= 0; k--) blit(bufB, cIn, k ? 0.2 * v : 1, W - off + k * 45 * v);
    } else if (type === 'zoom') {
      if (p < 0.5) blit(bufA, { ...cOut, z: cOut.z * (1 + 0.35 * eIC(p * 2)) });
      else blit(bufB, { ...cIn, z: cIn.z * (1.3 - 0.3 * eOC((p - 0.5) * 2)) });
      ctx.fillStyle = `rgba(255,255,255,${0.8 * Math.pow(1 - Math.abs(p - 0.5) * 2, 2)})`; ctx.fillRect(0, 0, W, H);
    } else {
      blit(bufA, cOut);
      const x = lerp(-300, W + 900, eIOC(p)), sl = 0.42;
      ctx.save(); ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(x - 140, 0); ctx.lineTo(x - 140 - H * sl, H); ctx.lineTo(-10, H); ctx.closePath(); ctx.clip();
      blit(bufB, cIn); ctx.restore();
      [C.audi, '#e8ebf0', C.vw].forEach((col, k) => {
        const x0 = x - k * 70; ctx.fillStyle = col;
        ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0 + 60, 0); ctx.lineTo(x0 + 60 - H * sl, H); ctx.lineTo(x0 - H * sl, H); ctx.closePath(); ctx.fill();
      });
    }
  }
  captions(t);
  hud(t);
  vignette(0.5);
  grain(t, 0.035);
  black(prog(t, DURATION - 0.6, DURATION));
  black(1 - prog(t, 0, 0.25));
  ctx.restore();
}
window.drawFrame = drawFrame;
window.DURATION = DURATION;

if (!location.hash.includes('render')) {
  const start = performance.now() - (parseFloat(new URLSearchParams(location.search).get('t')) || 0) * 1000;
  const loop = () => { drawFrame(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); };
  window.ready.then(() => requestAnimationFrame(loop));
}

</script>
</body>
