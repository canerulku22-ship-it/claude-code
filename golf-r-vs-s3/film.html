function timerPanel(x, align, v, tF, fin, t, col, light, nm) {

function sRace(t) {
  const t0 = CUT[2], u = prog(t, t0, CUT[3]);
  const gS = ON('05') + 0.3, go = gS - 0.3;
  const gT = Math.min(4.6, 4.6 * prog(t, gS, B.g46 + 0.05)), sT = Math.min(4.7, 4.7 * prog(t, gS, B.s47 + 0.05));
  const dG = launch(t, go, B.g46), dS = launch(t, go, B.s47);
  const lead = Math.min(1.2, (dG - dS) * 0.1), acc = env(t, go, B.s47 + 0.2, 0.15, 0.6), rumble = t > go - 1.4 && t < go ? 0.004 * Math.sin(t * 90) : 0;
  const at = three({
    cars: [{ id: 'golf', x: lead / 2, z: 1.75, spin: dG / 0.3236, pitch: 0.017 * acc + rumble, glow: 1 }, { id: 's3', x: -lead / 2, z: -1.75, spin: dS / 0.3236, pitch: 0.017 * acc - rumble, glow: 1 }],
    road: { dist: (dG + dS) / 2 },
    cam: { az: orbit(u, 20, 52), el: orbit(u, 4, 6), dist: orbit(u, 10.5, 12.5), fov: 30, target: [0.4, 0.55, 0], roll: Math.sin(t * 23) * 0.35 * acc },
    rim: { golf: 0.8, s3: 0.8 }, exposure: 1.0,
    anchors: { gRL: ['golf', -1.34, 0.3, 0.9], sRL: ['s3', -1.36, 0.3, 0.9], behind: behindRoad('golf') },
  });
  smokeFrom(t, at.gRL, at.behind, 0.35 * env(t, go, go + 0.9, 0.05, 0.5), 12, 0.8);
  smokeFrom(t, at.sRL, at.behind, 0.35 * env(t, go, go + 0.9, 0.05, 0.5), 14, 0.8);
  speedLines(t, 0.55 * prog(t, go, go + 0.5), 4, 120, 980, -1);
  for (let k = 0; k < 3; k++) {   // start lights, in time with the beeps in the soundtrack
    const on = t >= gS - 1.2 + k * 0.4, a = 1 - prog(t, gS + 0.4, gS + 0.8);
    if (a <= 0) continue;
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(5,7,12,0.8)'; ctx.beginPath(); ctx.arc(860 + k * 100, 130, 40, 0, Math.PI * 2); ctx.fill();
    if (on) glowDot(860 + k * 100, 130, 70, k < 2 ? '255,60,40' : '90,255,120', 0.9);
    ctx.fillStyle = on ? (k < 2 ? '#ff4630' : '#5eff7a') : '#20242b'; ctx.beginPath(); ctx.arc(860 + k * 100, 130, 30, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  timerPanel(120, 'left', gT, 4.6, B.g46, t, C.vw, '#cfe0ff', 'GOLF R');
  timerPanel(1800, 'right', sT, 4.7, B.s47, t, C.audi, '#ffd0c8', 'AUDI S3');
  if (gT >= 4.6) ringBurst(320, 260, t, B.g46, '120,175,255', 280, 2, 16);
  if (sT >= 4.7) ringBurst(1600, 260, t, B.s47, '255,130,110', 280, 2, 16);
  header(t, t0 + 0.1, CUT[3], '0–62 mph');
  if (t > B.tenth - 0.05) banner(t, B.tenth, 960, 175, 'A TENTH APART', C.amber, '#1a1000', 48, 30);
}

  const t0 = CUT[8];
  const u = prog(t, t0, DURATION);   // back in the 3D studio, both cars turning
  three({
    cars: [{ id: 'golf', x: 0.05, z: 1.4 }, { id: 's3', x: -0.1, z: -1.4 }],
    bigTable: { ry: -0.4 + 0.4 * u },
    cam: { az: orbit(u, 34, 20), el: 10, dist: orbit(u, 12.2, 13.0), fov: 30, target: [0, 0.3, 0] },
    rim: { golf: 1, s3: 1 },
  });
  topShade(0.7, 360);
  line('WHICH ONE WOULD YOU TAKE?', 960, 140, t, ON('11'), 999, { a: 'center', s: 72, w: 900, ls: 2 });
  const p = eOC(prog(t, ON('11') + 0.4, ON('11') + 1.8)), pg = 0.5 + Math.sin(t * 2.1) * 0.06 * p;
  ctx.save(); ctx.globalAlpha = prog(t, ON('11') + 0.3, ON('11') + 0.6);
  ctx.fillStyle = 'rgba(5,7,12,0.75)'; ctx.fill(roundPoly([[540, 185], [1380, 185], [1380, 275], [540, 275]], 14));
  ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(560, 238, 800, 20);
  ctx.fillStyle = C.vw; ctx.fillRect(560, 238, 800 * pg * p, 20);
  ctx.fillStyle = C.audi; ctx.fillRect(560 + 800 * (1 - (1 - pg) * p), 238, 800 * (1 - pg) * p, 20);
  text('GOLF R', 560, 226, { s: 22, w: 800, c: '#bcd5ff', ls: 4 }); text('AUDI S3', 1360, 226, { a: 'right', s: 22, w: 800, c: '#ffc4ba', ls: 4 });
  ctx.restore();
  if (t > B.comments - 0.1) {
    const q = eOB(prog(t, B.comments, B.comments + 0.35));
    ctx.save(); ctx.translate(960, 880); ctx.scale(clamp(q, 0, 1.2), clamp(q, 0, 1.2));
    ctx.fillStyle = C.go; ctx.beginPath(); ctx.roundRect(-230, -36, 460, 64, 32); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-150, 26); ctx.lineTo(-170, 52); ctx.lineTo(-120, 28); ctx.fill();
    text('LET ME KNOW IN THE COMMENTS', 0, 8, { a: 'center', s: 24, w: 900, c: '#062012', ls: 2 });
    ctx.restore();
  }
  line('All cars shown are approximate 3D models built for this film. Figures: manufacturer data, UK list prices 2025. Independent film, not affiliated with Volkswagen or Audi.', 960, 1052, t, OFF('11') + 0.2, 999, { a: 'center', s: 17, w: 500, c: '#8d96a4', st: 0.005, d: 0.3 });
}

/* =====================================================================
   COMPOSITOR — scene buffers, camera moves, transitions, HUD
   ===================================================================== */
const SCENES = [sHook, sTwins, sRace, sGolf, sAudi, sBoot, sPrice, sVerdict, sCTA].map((fn, i) => [CUT[i], CUT[i + 1], fn]);
const TRANS = [null, 'zoom', 'whip', 'stripe', 'whip', 'stripe', 'zoom', 'stripe', 'whip'];
const TR = 0.2;
const PUNCH = [[B.golf, 0.03], [B.audi, 0.03], [B.vs, 0.08], [B.twins, 0.05], [B.turbo, 0.03], [B.g46, 0.05], [B.s47, 0.05], [B.tenth, 0.04], [B.pack, 0.03], [B.drift, 0.09],
  [B.classier, 0.03], [B.sportback, 0.03], [B.estate, 0.04], [B.dog, 0.02], [B.prices, 0.04], [B.vGolf, 0.05], [B.vAudi, 0.05], [B.comments, 0.03]];
const mkBuf = () => { const c = document.createElement('canvas'); c.width = W; c.height = H; return [c, c.getContext('2d')]; };
const [bufA, ctxA] = mkBuf(), [bufB, ctxB] = mkBuf();
function renderScene(target, i, t) {
  const prev = ctx; ctx = target;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  SCENES[i][2](t);
  ctx.restore(); ctx = prev;
}
function camera(i, t) {
  const u = prog(t, SCENES[i][0], SCENES[i][1]);
  let z = 1 + 0.03 * eIOS(u), x = Math.sin(t * 0.7 + i * 1.3) * 6, y = Math.cos(t * 0.5 + i) * 4, r = 0;
  for (const [t0, amp] of PUNCH) {
    if (t < t0 || t > t0 + 1.5) continue;
    const d = Math.exp(-(t - t0) * 6), n = rng(Math.floor(t * 60) + 7);
    z += amp * d; x += (n() - 0.5) * 260 * amp * d; y += (n() - 0.5) * 200 * amp * d; r += (n() - 0.5) * 0.05 * amp * d;
  }
  return { z, x, y, r };
}
function blit(buf, c, alpha = 1, dx = 0) {
  ctx.save(); ctx.globalAlpha = alpha;
  ctx.translate(W / 2 + c.x + dx, H / 2 + c.y); ctx.rotate(c.r); ctx.scale(c.z, c.z);
  ctx.drawImage(buf, -W / 2, -H / 2);
  ctx.restore();
}
function hud(t) {
  const a = 0.6 * prog(t, 0.5, 1.1) * (1 - prog(t, DURATION - 2.2, DURATION - 1.8));
  hudCorners(a);
  if (a > 0) text(`R vs S3   ${t.toFixed(1).padStart(4, '0')}`, W - 104, 70, { a: 'right', s: 17, w: 600, f: 'JetBrains Mono', c: 'rgba(255,255,255,0.55)', al: a * 1.6 });
}
function drawFrame(t) {
  ctx = main;
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  let i = SCENES.findIndex(([a, b]) => t >= a && t < b);
  if (i < 0) i = SCENES.length - 1;
  let j = -1, p = 0;
  if (i > 0 && t - SCENES[i][0] < TR) { j = i; p = 0.5 + (t - SCENES[i][0]) / (2 * TR); }
  else if (i < SCENES.length - 1 && SCENES[i][1] - t < TR) { j = i + 1; p = 0.5 - (SCENES[i][1] - t) / (2 * TR); }
  if (j < 0) {
    renderScene(ctxA, i, t); blit(bufA, camera(i, t));
  } else {
    const c = SCENES[j][0], tOut = Math.min(t, c - 0.001), tIn = Math.max(t, c);
    renderScene(ctxA, j - 1, tOut); renderScene(ctxB, j, tIn);
    const cOut = camera(j - 1, tOut), cIn = camera(j, tIn), type = TRANS[j];
    if (type === 'whip') {
      const off = eIOC(p) * W, v = Math.sin(Math.PI * p);
      for (let k = 4; k >= 0; k--) blit(bufA, cOut, k ? 0.2 * v : 1, -off + k * 45 * v);
      for (let k = 4; k >= 0; k--) blit(bufB, cIn, k ? 0.2 * v : 1, W - off + k * 45 * v);
    } else if (type === 'zoom') {
      if (p < 0.5) blit(bufA, { ...cOut, z: cOut.z * (1 + 0.35 * eIC(p * 2)) });
      else blit(bufB, { ...cIn, z: cIn.z * (1.3 - 0.3 * eOC((p - 0.5) * 2)) });
      ctx.fillStyle = `rgba(255,255,255,${0.8 * Math.pow(1 - Math.abs(p - 0.5) * 2, 2)})`; ctx.fillRect(0, 0, W, H);
    } else {
      blit(bufA, cOut);
      const x = lerp(-300, W + 900, eIOC(p)), sl = 0.42;
      ctx.save(); ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(x - 140, 0); ctx.lineTo(x - 140 - H * sl, H); ctx.lineTo(-10, H); ctx.closePath(); ctx.clip();
      blit(bufB, cIn); ctx.restore();
      [C.audi, '#e8ebf0', C.vw].forEach((col, k) => {
        const x0 = x - k * 70; ctx.fillStyle = col;
        ctx.beginPath(); ctx.moveTo(x0, 0); ctx.lineTo(x0 + 60, 0); ctx.lineTo(x0 + 60 - H * sl, H); ctx.lineTo(x0 - H * sl, H); ctx.closePath(); ctx.fill();
      });
    }
  }
  captions(t);
  hud(t);
  vignette(0.5);
  grain(t, 0.035);
  black(prog(t, DURATION - 0.6, DURATION));
  black(1 - prog(t, 0, 0.25));
  ctx.restore();
}
window.drawFrame = drawFrame;
window.DURATION = DURATION;

if (!location.hash.includes('render')) {
  const start = performance.now() - (parseFloat(new URLSearchParams(location.search).get('t')) || 0) * 1000;
  const loop = () => { drawFrame(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); };
  window.ready.then(() => requestAnimationFrame(loop));
}

</script>
</body>
