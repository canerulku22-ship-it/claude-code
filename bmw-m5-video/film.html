<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BMW M5 Film</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; position: absolute; inset: 0; margin: auto;
           width: min(100vw, 177.78vh); height: min(56.25vw, 100vh); }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
/* =====================================================================
   BMW M5 — a motion-graphics film rendered frame by frame on a canvas.
   drawFrame(t) is a pure function of time t (seconds), so render.mjs
   can step through it deterministically. Open this file directly in a
   browser to preview it in real time.
   ===================================================================== */

const W = 1920, H = 1080, DURATION = 103;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const C = {
  ink: '#f3f5f8', mute: '#9aa3b2', dim: '#5a6476', line: 'rgba(255,255,255,0.12)',
  mBlue: '#3fa9f5', mNavy: '#3a5fc8', mRed: '#e5322d', ev: '#38d6ff', amber: '#ffb24a',
  warm: '#ffd38a',
};

/* ---------- maths & easing ---------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const eOC = t => 1 - Math.pow(1 - t, 3);
const eIC = t => t * t * t;
const eIOC = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const eOE = t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
const eOB = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const eIOS = t => -(Math.cos(Math.PI * t) - 1) / 2;
function rng(seed) { // mulberry32
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let r = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
// alpha envelope: fade in over [a, a+fi], out over [b-fo, b]
const env = (t, a, b, fi = 0.35, fo = 0.35) => Math.min(prog(t, a, a + fi), 1 - prog(t, b - fo, b));

/* ---------- text ---------- */
const font = (w, s, f = 'Inter Display') => `${w} ${s}px '${f}'`;
function text(str, x, y, o = {}) {
  ctx.save();
  ctx.font = font(o.w || 600, o.s || 48, o.f);
  ctx.fillStyle = o.c || C.ink;
  ctx.textAlign = o.a || 'left';
  ctx.textBaseline = o.b || 'alphabetic';
  ctx.letterSpacing = (o.ls || 0) + 'px';
  ctx.globalAlpha *= (o.al ?? 1);
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 30; }
  ctx.fillText(str, x, y);
  ctx.restore();
}
function measure(str, o = {}) {
  ctx.save();
  ctx.font = font(o.w || 600, o.s || 48, o.f);
  ctx.letterSpacing = (o.ls || 0) + 'px';
  const m = ctx.measureText(str).width;
  ctx.restore();
  return m;
}
// Kinetic line: words rise in with a stagger at t0, leave from t1.
function line(str, x, y, t, t0, t1, o = {}) {
  const out = o.out ?? 0.4;
  if (t < t0 || t > t1 + out) return;
  ctx.save();
  ctx.font = font(o.w || 600, o.s || 48, o.f);
  ctx.letterSpacing = (o.ls || 0) + 'px';
  ctx.textBaseline = 'alphabetic';
  ctx.textAlign = 'left';
  const words = str.split(' ');
  const space = ctx.measureText(' ').width;
  const widths = words.map(w => ctx.measureText(w).width);
  const total = widths.reduce((a, b) => a + b, 0) + space * (words.length - 1);
  let cx = o.a === 'center' ? x - total / 2 : o.a === 'right' ? x - total : x;
  const st = o.st ?? 0.055, d = o.d ?? 0.6;
  const ex = eIC(prog(t, t1, t1 + out));
  const size = o.s || 48;
  words.forEach((wd, i) => {
    const p = eOC(prog(t, t0 + i * st, t0 + i * st + d));
    const key = wd.replace(/[.,!?:;—]/g, '');
    ctx.fillStyle = (o.hl && o.hl[key]) || o.c || C.ink;
    ctx.globalAlpha = p * (1 - ex) * (o.al ?? 1);
    if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.gb || 24; }
    const dy = (1 - p) * size * 0.55 - ex * size * 0.3;
    ctx.fillText(wd, cx, y + dy);
    cx += widths[i] + space;
  });
  ctx.restore();
}
// Typewriter (mono)
function typed(str, x, y, t, t0, t1, o = {}) {
  if (t < t0 || t > t1 + 0.3) return;
  const n = Math.floor(clamp((t - t0) / (o.cps ? 1 / o.cps : 0.035) , 0, str.length));
  const a = 1 - prog(t, t1, t1 + 0.3);
  const shown = str.slice(0, n);
  text(shown, x, y, { ...o, f: o.f || 'JetBrains Mono', al: a * (o.al ?? 1) });
  if (n < str.length || Math.floor(t * 3) % 2 === 0) {
    const w = measure(shown, { ...o, f: o.f || 'JetBrains Mono' });
    ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = o.c || C.mBlue;
    ctx.fillRect(x + w + 4, y - (o.s || 30) * 0.8, (o.s || 30) * 0.5, (o.s || 30) * 0.95); ctx.restore();
  }
}
function tri(x, y, w, h, p, alpha = 1) { // M-style tricolour stripe
  const cols = [C.mBlue, C.mNavy, C.mRed];
  ctx.save(); ctx.globalAlpha = alpha;
  cols.forEach((c, i) => {
    const pp = eOC(prog(p, i * 0.15, 0.55 + i * 0.15));
    ctx.fillStyle = c;
    ctx.beginPath();
    const x0 = x + i * (w + 8);
    ctx.moveTo(x0 + h * 0.6, y); ctx.lineTo(x0 + h * 0.6 + w * pp, y);
    ctx.lineTo(x0 + w * pp, y + h); ctx.lineTo(x0, y + h); ctx.closePath(); ctx.fill();
  });
  ctx.restore();
}

/* ---------- overlays ---------- */
const grainCv = document.createElement('canvas');
grainCv.width = grainCv.height = 256;
{
  const g = grainCv.getContext('2d'), id = g.createImageData(256, 256), r = rng(99);
  for (let i = 0; i < id.data.length; i += 4) {
    const v = Math.floor(r() * 255);
    id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255;
  }
  g.putImageData(id, 0, 0);
}
function grain(t, a = 0.05) {
  const f = Math.floor(t * 30);
  const r = rng(f + 1);
  ctx.save();
  ctx.globalAlpha = a; ctx.globalCompositeOperation = 'overlay';
  const ox = Math.floor(r() * 256), oy = Math.floor(r() * 256);
  ctx.translate(-ox, -oy);
  ctx.fillStyle = ctx.createPattern(grainCv, 'repeat');
  ctx.fillRect(0, 0, W + 256, H + 256);
  ctx.restore();
}
function vignette(a = 0.65) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function black(a) { if (a <= 0) return; ctx.fillStyle = `rgba(0,0,0,${clamp(a)})`; ctx.fillRect(0, 0, W, H); }
function flash(t, t0, d = 0.35, a = 0.8) {
  const p = prog(t, t0, t0 + d); if (p <= 0 || p >= 1) return;
  ctx.fillStyle = `rgba(255,255,255,${a * (1 - eOC(p))})`; ctx.fillRect(0, 0, W, H);
}

/* =====================================================================
   THE CAR — a generic modern super-saloon in side profile, facing right.
   Local units: x 0 (rear) .. 1000 (nose), ground at y = 0, up is -y.
   k morphs saloon (0) into an estate/Touring roofline (1).
   ===================================================================== */
const RW = { x: 222, y: -71 }, FW = { x: 812, y: -71 }, TYRE = 71;
function L(a, b, k) { return a.map((v, i) => lerp(v, b[i], k)); }
function bodyPath(k = 0) {
  const p = new Path2D();
  const archA = 2.6, archB = 0.54, ar = 84;
  p.moveTo(30, -28);
  p.lineTo(150, -28);
  p.arc(RW.x, RW.y, ar, archA, archB, false);
  p.lineTo(740, -28);
  p.arc(FW.x, FW.y, ar, archA, archB, false);
  p.lineTo(968, -26);
  p.quadraticCurveTo(992, -30, 997, -58);
  p.lineTo(1001, -112);
  p.quadraticCurveTo(1003, -140, 984, -150);
  p.bezierCurveTo(900, -166, 780, -190, 690, -203);
  p.bezierCurveTo(640, -232, 592, -270, 548, -288);
  let s;
  s = L([500, -299, 400, -299, 345, -287], [500, -299, 400, -298, 300, -293], k); p.bezierCurveTo(...s);
  s = L([280, -268, 210, -232, 175, -214], [220, -290, 140, -285, 94, -277], k); p.bezierCurveTo(...s);
  s = L([140, -208, 90, -208, 58, -211], [72, -271, 54, -252, 48, -238], k); p.bezierCurveTo(...s);
  s = L([44, -215], [42, -228], k); p.lineTo(...s);
  s = L([30, -207, 18, -190, 14, -170], [30, -212, 18, -194, 14, -170], k); p.bezierCurveTo(...s);
  p.lineTo(8, -118);
  p.bezierCurveTo(6, -80, 14, -46, 30, -28);
  p.closePath();
  return p;
}
function glassPath(k = 0) {
  const p = new Path2D();
  p.moveTo(666, -206);
  p.bezierCurveTo(624, -233, 586, -262, 550, -277);
  let s = L([500, -286, 400, -286, 352, -275], [500, -286, 400, -285, 300, -282], k); p.bezierCurveTo(...s);
  s = L([300, -262, 252, -238, 216, -219], [190, -279, 120, -273, 104, -228], k); p.bezierCurveTo(...s);
  s = L([226, -214], [110, -219], k); p.lineTo(...s);
  p.lineTo(666, -206);
  p.closePath();
  return p;
}
const paint = { hi: '#9cc7b6', top: '#4f8270', mid: '#21473b', low: '#0d221c', deep: '#06110d' };

function drawWheel(cx, cy, rot, blur = 0, bp = false) {
  ctx.save();
  ctx.translate(cx, cy);
  if (bp) {
    ctx.beginPath(); ctx.arc(0, 0, TYRE, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 54, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.stroke();
    ctx.restore(); return;
  }
  // tyre
  const tg = ctx.createRadialGradient(0, 0, 50, 0, 0, TYRE);
  tg.addColorStop(0, '#16181c'); tg.addColorStop(0.8, '#0b0c0f'); tg.addColorStop(1, '#050506');
  ctx.fillStyle = tg; ctx.beginPath(); ctx.arc(0, 0, TYRE, 0, Math.PI * 2); ctx.fill();
  // rim barrel
  ctx.fillStyle = '#0e1013'; ctx.beginPath(); ctx.arc(0, 0, 55, 0, Math.PI * 2); ctx.fill();
  // brake disc + caliper (fixed)
  const dg = ctx.createRadialGradient(0, 0, 10, 0, 0, 46);
  dg.addColorStop(0, '#3a3d42'); dg.addColorStop(1, '#5d6168');
  ctx.fillStyle = dg; ctx.beginPath(); ctx.arc(0, 0, 45, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2a63c9';
  ctx.beginPath(); ctx.arc(0, 0, 47, -1.25, -0.25); ctx.arc(0, 0, 33, -0.25, -1.25, true); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath(); ctx.arc(0, 0, 46, -1.15, -0.85); ctx.arc(0, 0, 43, -0.85, -1.15, true); ctx.closePath(); ctx.fill();
  // spokes
  const sa = 1 - blur * 0.85;
  ctx.save(); ctx.rotate(rot);
  for (let i = 0; i < 5; i++) {
    ctx.save(); ctx.rotate(i * Math.PI * 2 / 5);
    for (const off of [-0.17, 0.17]) {
      ctx.save(); ctx.rotate(off);
      const g = ctx.createLinearGradient(0, -12, 0, -54);
      g.addColorStop(0, `rgba(70,74,82,${sa})`); g.addColorStop(1, `rgba(150,156,166,${sa})`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(-6, -12); ctx.lineTo(6, -12); ctx.lineTo(4, -53); ctx.lineTo(-4, -53); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  ctx.restore();
  if (blur > 0) { // motion smear
    ctx.fillStyle = `rgba(110,116,126,${blur * 0.45})`;
    ctx.beginPath(); ctx.arc(0, 0, 53, 0, Math.PI * 2); ctx.arc(0, 0, 14, 0, Math.PI * 2, true); ctx.fill();
  }
  // rim lip + hub
  ctx.strokeStyle = '#7d838c'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, 54, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = '#1b1d21'; ctx.beginPath(); ctx.arc(0, 0, 12, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#9aa1ab'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// x, y: screen position of local (0,0); s: scale.
function drawCar(x, y, s, o = {}) {
  const k = o.k || 0, rot = o.rot || 0, blur = o.blur || 0;
  ctx.save();
  ctx.translate(x, y); ctx.scale(s, s);
  if (o.alpha != null) ctx.globalAlpha *= o.alpha;
  const body = bodyPath(k), glass = glassPath(k);

  if (o.blueprint) {
    const bp = o.blueprint; // progress 0..1 for line draw-on
    ctx.lineWidth = 2.2 / s * (o.lw || 1.4);
    ctx.strokeStyle = o.bpColor || 'rgba(120,200,255,0.9)';
    ctx.shadowColor = 'rgba(80,180,255,0.6)'; ctx.shadowBlur = 12;
    ctx.setLineDash([3200, 3200]); ctx.lineDashOffset = 3200 * (1 - bp);
    ctx.stroke(body); ctx.stroke(glass);
    ctx.setLineDash([]);
    ctx.globalAlpha *= clamp(bp * 1.5 - 0.3);
    ctx.lineWidth = 1.2 / s * 1.4; ctx.strokeStyle = 'rgba(120,200,255,0.45)';
    ctx.beginPath(); ctx.moveTo(965, -150); ctx.bezierCurveTo(800, -170, 400, -186, 40, -192); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(668, -205); ctx.lineTo(684, -40); ctx.moveTo(456, -212); ctx.lineTo(458, -36); ctx.stroke();
    ctx.lineWidth = 2.2 / s * 1.4; ctx.strokeStyle = o.bpColor || 'rgba(120,200,255,0.9)';
    drawWheel(RW.x, RW.y, 0, 0, true); drawWheel(FW.x, FW.y, 0, 0, true);
    ctx.restore();
    return;
  }

  // ground shadow
  if (!o.noShadow) {
    ctx.save();
    const sg = ctx.createRadialGradient(500, 0, 20, 500, 0, 560);
    sg.addColorStop(0, 'rgba(0,0,0,0.85)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.scale(1, 0.09); ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(500, 0, 560, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  // wheel wells (dark behind wheels)
  ctx.fillStyle = '#030405';
  ctx.beginPath(); ctx.arc(RW.x, RW.y, 82, Math.PI, 0); ctx.arc(FW.x, FW.y, 82, Math.PI, 0); ctx.fill();
  drawWheel(RW.x, RW.y, rot, blur); drawWheel(FW.x, FW.y, rot, blur);

  // body paint
  const pg = ctx.createLinearGradient(0, -300, 0, -24);
  pg.addColorStop(0, paint.hi); pg.addColorStop(0.18, paint.top); pg.addColorStop(0.38, paint.mid);
  pg.addColorStop(0.44, '#5d9480'); pg.addColorStop(0.47, paint.mid);
  pg.addColorStop(0.75, paint.low); pg.addColorStop(1, paint.deep);
  ctx.fillStyle = pg; ctx.fill(body);

  ctx.save(); ctx.clip(body);
  // horizontal environment reflection on the flank
  const rg = ctx.createLinearGradient(0, -140, 0, -60);
  rg.addColorStop(0, 'rgba(255,255,255,0)'); rg.addColorStop(0.5, 'rgba(190,230,215,0.10)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = rg; ctx.fillRect(0, -140, 1000, 80);
  // lower body + sill in darker trim
  ctx.fillStyle = 'rgba(5,10,9,0.85)';
  ctx.fillRect(0, -44, 1000, 20);
  // moving light sweep
  if (o.sweep != null && o.sweep > 0 && o.sweep < 1) {
    const sx = lerp(-300, 1300, o.sweep);
    const lg = ctx.createLinearGradient(sx - 160, 0, sx + 160, 0);
    lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, 'rgba(255,255,255,0.42)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = lg;
    ctx.save(); ctx.transform(1, 0, -0.5, 1, 0, 0); ctx.fillRect(sx - 300, -320, 600, 320); ctx.restore();
  }
  ctx.restore();

  // glass
  const gg = ctx.createLinearGradient(0, -290, 0, -205);
  gg.addColorStop(0, '#3b4a58'); gg.addColorStop(0.45, '#141b22'); gg.addColorStop(1, '#07090c');
  ctx.fillStyle = gg; ctx.fill(glass);
  ctx.save(); ctx.clip(glass);
  ctx.fillStyle = 'rgba(200,225,255,0.10)';
  ctx.beginPath(); ctx.moveTo(560, -300); ctx.lineTo(620, -300); ctx.lineTo(500, -200); ctx.lineTo(440, -200); ctx.fill();
  // pillars
  ctx.fillStyle = '#05070a';
  ctx.fillRect(448, -300, 14, 110);
  if (k > 0.02) { ctx.globalAlpha *= k; ctx.fillRect(lerp(240, 214, k), -300, 16, 110); }
  ctx.restore();
  ctx.strokeStyle = 'rgba(10,14,18,0.9)'; ctx.lineWidth = 3; ctx.stroke(glass);

  // character lines
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(220,255,240,0.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(965, -148); ctx.bezierCurveTo(800, -168, 400, -184, 40, -190); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(960, -143); ctx.bezierCurveTo(800, -162, 400, -178, 36, -184); ctx.stroke();
  ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(732, -86); ctx.bezierCurveTo(600, -78, 420, -80, 302, -92); ctx.stroke();
  // shut lines
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(668, -205); ctx.bezierCurveTo(676, -150, 690, -100, 690, -44);
  ctx.moveTo(456, -213); ctx.lineTo(460, -40);
  const rd = lerp(300, 300, k);
  ctx.moveTo(lerp(226, 226, k), -214); ctx.bezierCurveTo(rd, -170, rd + 8, -120, 304, -84);
  ctx.stroke();
  // handles
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(588, -184, 44, 5); ctx.fillRect(382, -187, 44, 5);
  // side gill
  ctx.fillStyle = '#05080a';
  ctx.beginPath(); ctx.moveTo(716, -132); ctx.lineTo(758, -134); ctx.lineTo(752, -124); ctx.lineTo(712, -122); ctx.fill();
  // mirror
  ctx.fillStyle = paint.mid;
  ctx.beginPath(); ctx.moveTo(660, -206); ctx.quadraticCurveTo(646, -236, 616, -236); ctx.lineTo(602, -226);
  ctx.quadraticCurveTo(612, -210, 636, -206); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(200,240,225,0.25)'; ctx.fillRect(612, -236, 30, 3);
  // charge flap
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.4; ctx.strokeRect(712, -166, 26, 18);
  // front intake & grille edge
  ctx.fillStyle = '#04070a';
  ctx.beginPath(); ctx.moveTo(996, -96); ctx.lineTo(950, -92); ctx.quadraticCurveTo(936, -66, 950, -44); ctx.lineTo(992, -44); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(1000, -138); ctx.lineTo(990, -136); ctx.lineTo(992, -104); ctx.lineTo(1001, -104); ctx.closePath(); ctx.fill();
  // rear diffuser + exhaust
  ctx.fillStyle = '#050608';
  ctx.beginPath(); ctx.moveTo(12, -62); ctx.lineTo(80, -58); ctx.lineTo(70, -30); ctx.lineTo(28, -28); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5c6068'; ctx.beginPath(); ctx.ellipse(30, -44, 10, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.ellipse(30, -44, 6, 4, 0, 0, Math.PI * 2); ctx.fill();

  // lights
  const lo = o.lights ?? 0;
  ctx.fillStyle = lo > 0 ? `rgba(240,248,255,${0.5 + 0.5 * lo})` : '#20262c';
  ctx.beginPath(); ctx.moveTo(987, -150); ctx.lineTo(930, -153); ctx.quadraticCurveTo(920, -146, 930, -140); ctx.lineTo(994, -138); ctx.closePath(); ctx.fill();
  ctx.fillStyle = lo > 0 ? `rgba(255,40,40,${0.6 + 0.4 * lo})` : '#5a1414';
  ctx.beginPath(); ctx.moveTo(16, -176); ctx.lineTo(76, -183); ctx.quadraticCurveTo(84, -176, 76, -170); ctx.lineTo(12, -162); ctx.closePath(); ctx.fill();
  if (lo > 0) {
    ctx.globalCompositeOperation = 'lighter';
    let g = ctx.createRadialGradient(990, -146, 2, 990, -146, 90);
    g.addColorStop(0, `rgba(200,230,255,${0.55 * lo})`); g.addColorStop(1, 'rgba(200,230,255,0)');
    ctx.fillStyle = g; ctx.fillRect(880, -240, 220, 190);
    g = ctx.createRadialGradient(30, -172, 2, 30, -172, 90);
    g.addColorStop(0, `rgba(255,40,40,${0.5 * lo})`); g.addColorStop(1, 'rgba(255,40,40,0)');

function speedLines(t, a, seed = 3, y0 = 200, y1 = 900, dir = -1) {
  if (a <= 0) return;
  const r = rng(seed);
  ctx.save(); ctx.globalAlpha = a;
  for (let i = 0; i < 46; i++) {
    const y = y0 + r() * (y1 - y0), len = 200 + r() * 600, sp = 2600 + r() * 2600, ph = r() * 3000;
    let x = ((ph + t * sp) % (W + len * 2)) - len;

    g.addColorStop(0, 'rgba(200,225,255,0.35)'); g.addColorStop(1, 'rgba(200,225,255,0)');
    ctx.fillStyle = g; ctx.fillRect(Math.min(x, x - len * dir), y, len, 1.5 + r() * 1.5);
  }
  ctx.restore();
}

// 1 — Cold open (0 – 6.2)
function sCold(t) {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const r = rng(7);
  for (let i = 0; i < 16; i++) { // passing headlight streaks
    const st = r() * 6, y = 160 + r() * 760, len = 300 + r() * 900, sp = 1600 + r() * 2600;
    const red = r() < 0.35, col = red ? '255,60,50' : '190,215,255';
    const x = -len + (t - st) * sp;
    if (x > W || x + len < 0) continue;
    const g = ctx.createLinearGradient(x, 0, x + len, 0);
    g.addColorStop(0, `rgba(${col},0)`); g.addColorStop(1, `rgba(${col},0.45)`);
    ctx.fillStyle = g; ctx.fillRect(x, y, len, 2);
  }
  // engine "pulse" oscilloscope
  const blips = [1.0, 2.95, 4.65];
  let amp = 6;
  for (const b of blips) amp += 70 * Math.exp(-Math.max(0, t - b) * 4) * (t > b ? 1 : 0);
  ctx.save();
  ctx.strokeStyle = 'rgba(63,169,245,0.85)'; ctx.lineWidth = 2.5; ctx.shadowColor = C.mBlue; ctx.shadowBlur = 18;
  ctx.globalAlpha = 0.75 * env(t, 0, 6.2, 0.6, 0.5);
  ctx.beginPath();
  for (let x = 460; x <= 1460; x += 4) {
    const w = Math.sin(Math.PI * (x - 460) / 1000);
    const y = 860 + Math.sin(x * 0.045 - t * 14) * Math.sin(x * 0.011 + t * 3) * amp * w * w;
    x === 460 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke(); ctx.restore();
  line('Some cars are fast.', 960, 560, t, 0.45, 2.05, { a: 'center', s: 88, w: 700 });
  line('Some cars are practical.', 960, 560, t, 2.4, 3.95, { a: 'center', s: 88, w: 700 });
  line('Very few are both.', 960, 575, t, 4.35, 5.85, { a: 'center', s: 116, w: 800, hl: { both: C.mBlue }, glow: 'rgba(63,169,245,0.35)' });
}

function sHistory(t) {

      ['E60', "'04", 507, 'V10'], ['F10', "'11", 560, 'Twin-turbo V8'], ['F90', "'17", 600, 'TT V8 · AWD'],

    const fade = 1 - prog(t, 28.0, 28.5);
    ctx.save(); ctx.globalAlpha = fade;
    line('Seven generations. One idea.', 150, 205, t, 18.4, 30, { s: 64, w: 800 });
    line('Power at launch, PS', 150, 255, t, 18.7, 30, { s: 28, w: 500, c: C.mute });
    line('727 PS — the most powerful M5 yet.', 150, 340, t, 25.5, 30, { s: 40, w: 700, c: C.mBlue, glow: 'rgba(63,169,245,0.4)' });

      ctx.fillStyle = last ? '#fff' : 'rgba(255,255,255,0.6)'; ctx.fillRect(bx, base - h, bw, 3);

      text(g[0], bx + bw / 2, base + 50, { a: 'center', s: 34, w: 800, al: clamp(p * 3), c: last ? C.mBlue : C.ink });
      text(g[1], bx + bw / 2, base + 84, { a: 'center', s: 24, w: 500, f: 'JetBrains Mono', c: C.mute, al: clamp(p * 3) });

    });

    if (lp > 0) {
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 2; ctx.setLineDash([8, 8]);
      ctx.beginPath();
      const n = (tops.length - 1) * lp;
      tops.forEach(([x, y], i) => {
        if (i > Math.ceil(n)) return;
        const yy = y - 74;
        if (i === 0) ctx.moveTo(x, yy);
        else if (i <= n) ctx.lineTo(x, yy);
        else { const f = n - Math.floor(n); const [px, py] = tops[i - 1]; ctx.lineTo(lerp(px, x, f), lerp(py - 74, yy, f)); }
      });
      ctx.stroke(); ctx.restore();
    }
    ctx.restore();
  }

// 4 — Anatomy (28.5 – 45)
function blueprintBg(t, a = 1) {
  ctx.fillStyle = '#040a14'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = a;
  const off = (t * 12) % 40;
  ctx.strokeStyle = 'rgba(90,150,220,0.07)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = -off; x < W; x += 40) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y < H; y += 40) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(90,150,220,0.13)';
  ctx.beginPath();
  for (let x = -off; x < W; x += 200) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = 0; y < H; y += 200) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();
  const g = ctx.createRadialGradient(960, 560, 0, 960, 560, 900);
  g.addColorStop(0, 'rgba(40,110,200,0.16)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
function polyPoint(pts, f) { // point at fraction f along polyline
  let total = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); total += d; }
  let d = f * total;
  for (let i = 0; i < seg.length; i++) {
    if (d <= seg[i]) { const k = d / seg[i]; return [lerp(pts[i][0], pts[i + 1][0], k), lerp(pts[i][1], pts[i + 1][1], k)]; }
    d -= seg[i];
  }
  return pts[pts.length - 1];
}
function flow(pts, t, col, n = 10, speed = 0.6, size = 5, a = 1) {
  if (a <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = col.replace('A', '0.25'); ctx.lineWidth = 3;
  ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
  for (let i = 0; i < n; i++) {
    const f = ((t * speed + i / n) % 1);
    const [x, y] = polyPoint(pts, f);
    const g = ctx.createRadialGradient(x, y, 0, x, y, size * 3);
    g.addColorStop(0, col.replace('A', '1')); g.addColorStop(1, col.replace('A', '0'));
    ctx.fillStyle = g; ctx.fillRect(x - size * 3, y - size * 3, size * 6, size * 6);
  }
  ctx.restore();
}

  const ex = lerp(ax, mx, p), ey = lerp(ay, my, p);
  ctx.lineTo(ex, ey); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(ax, ay, 6, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 0.3; ctx.beginPath(); ctx.arc(ax, ay, 6 + 10 * ((t * 1.5) % 1), 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
  line(title, lx, ly, t, t0 + 0.25, 99, { s: 40, w: 700 });
  line(sub, lx, ly + 40, t, t0 + 0.4, 99, { s: 26, w: 500, c: col, st: 0.03 });
}

      const f = (t * 0.8 + i / 8) % 1, sg = segs[f < 0.5 ? 0 : 1], u = (f % 0.5) * 2, v = 1 - u;
      const b = [v * v * v, 3 * v * v * u, 3 * v * u * u, u * u * u];
      const px = b.reduce((s2, c, j) => s2 + c * sg[j][0], 0), py = b.reduce((s2, c, j) => s2 + c * sg[j][1], 0);
      const g = ctx.createRadialGradient(px, py, 0, px, py, 16);
      g.addColorStop(0, `rgba(56,214,255,${ca})`); g.addColorStop(1, 'rgba(56,214,255,0)');
      ctx.fillStyle = g; ctx.fillRect(px - 16, py - 16, 32, 32);
    }
  }
  // battery HUD
  const pct = t < 72.2 ? 60 : lerp(60, 100, eIOS(prog(t, 72.2, 75.2)));
  const hx = 560, hy = 470;
  ctx.save(); ctx.globalAlpha = prog(t, 71.8, 72.3);
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.roundRect(hx, hy, 300, 110, 14); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.fillRect(hx + 300, hy + 35, 12, 40);
  ctx.fillStyle = pct >= 99.5 ? '#5ef08a' : C.ev; ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 24;
  ctx.beginPath(); ctx.roundRect(hx + 10, hy + 10, 280 * pct / 100, 90, 8); ctx.fill(); ctx.shadowBlur = 0;
  text(`${Math.round(pct)}%`, hx + 340, hy + 76, { s: 64, w: 700, f: 'JetBrains Mono', c: pct >= 99.5 ? '#5ef08a' : C.ink });
  ctx.restore();
  line('18:45 — Home. Plug in.', 150, 200, t, 71.2, 75.6, { s: 34, w: 600, c: C.warm, f: 'JetBrains Mono' });
  line('Charge overnight on an off-peak tariff.', 150, 290, t, 71.5, 75.6, { s: 60, w: 800 });
  line('Full by breakfast.', 150, 365, t, 74.2, 75.6, { s: 60, w: 800, c: '#5ef08a' });
}
// winding mountain road (map view)
const ROAD = (() => {
  const pts = [];
  const ctrl = [[120, 980], [380, 900], [520, 760], [430, 620], [560, 520], [800, 600], [930, 470], [820, 330], [980, 240], [1200, 330], [1300, 520], [1480, 600], [1600, 450], [1520, 300], [1700, 200], [1900, 140]];
  for (let i = 0; i < ctrl.length - 1; i++) { // Catmull-Rom
    const p0 = ctrl[Math.max(0, i - 1)], p1 = ctrl[i], p2 = ctrl[i + 1], p3 = ctrl[Math.min(ctrl.length - 1, i + 2)];
    for (let s = 0; s < 1; s += 0.05) {
      const s2 = s * s, s3 = s2 * s;
      const f = (a, b, c, d) => 0.5 * ((2 * b) + (-a + c) * s + (2 * a - 5 * b + 4 * c - d) * s2 + (-a + 3 * b - 3 * c + d) * s3);
      pts.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
    }
  }
  pts.push(ctrl[ctrl.length - 1]);
  return pts;
})();
function rain(t, a = 1, n = 260) {
  const r = rng(77);
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = 'rgba(190,210,235,0.35)'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const sp = 1400 + r() * 900, x0 = r() * (W + 400), y0 = r() * H;
    const y = (y0 + t * sp) % (H + 100) - 50, x = (x0 - (t * sp) * 0.25) % (W + 400);
    const xx = x < 0 ? x + W + 400 : x;
    ctx.moveTo(xx, y); ctx.lineTo(xx - 8, y + 32);
  }
  ctx.stroke(); ctx.restore();
}
function sWales(t) { // 76 – 82
  ctx.fillStyle = '#08100d'; ctx.fillRect(0, 0, W, H);
  // contours
  ctx.save(); ctx.strokeStyle = 'rgba(120,200,150,0.08)'; ctx.lineWidth = 1.5;
  for (let k = 0; k < 14; k++) {
    for (const [cx, cy] of [[700, 420], [1350, 720], [300, 300]]) {
      ctx.beginPath();
      for (let a = 0; a <= Math.PI * 2 + 0.01; a += 0.08) {
        const rr = 40 + k * 34 + Math.sin(a * 3 + k * 0.6 + cx) * 14 + Math.sin(a * 5 + k) * 8;
        const x = cx + Math.cos(a) * rr * 1.3, y = cy + Math.sin(a) * rr;
        a === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  }
  ctx.restore();
  const dp = eIOC(prog(t, 76.3, 77.0));
  const cp = eIOS(prog(t, 76.8, 81.6));
  const n = ROAD.length;
  // road base
  ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(20,28,26,1)'; ctx.lineWidth = 26;
  ctx.beginPath(); ROAD.slice(0, Math.max(2, Math.floor(n * dp))).forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 2; ctx.setLineDash([10, 12]); ctx.stroke(); ctx.setLineDash([]);
  // trail
  const upto = Math.floor((n - 1) * cp);
  if (upto > 1) {
    const g = ctx.createLinearGradient(0, 1000, 1900, 140);
    g.addColorStop(0, C.mBlue); g.addColorStop(0.6, C.mNavy); g.addColorStop(1, C.mRed);
    ctx.strokeStyle = g; ctx.lineWidth = 8; ctx.shadowColor = C.mBlue; ctx.shadowBlur = 22;
    ctx.beginPath(); ROAD.slice(0, upto + 1).forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke();
    ctx.shadowBlur = 0;
  }
  // car marker
  if (t > 76.8) {
    const fi = (n - 1) * cp, i0 = Math.floor(fi), i1 = Math.min(n - 1, i0 + 1), f = fi - i0;
    const x = lerp(ROAD[i0][0], ROAD[i1][0], f), y = lerp(ROAD[i0][1], ROAD[i1][1], f);
    const ang = Math.atan2(ROAD[i1][1] - ROAD[i0][1], ROAD[i1][0] - ROAD[i0][0]);
    ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
    ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.roundRect(-18, -9, 36, 18, 5); ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    const bg = ctx.createLinearGradient(18, 0, 140, 0);
    bg.addColorStop(0, 'rgba(220,235,255,0.4)'); bg.addColorStop(1, 'rgba(220,235,255,0)');
    ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(18, -6); ctx.lineTo(140, -40); ctx.lineTo(140, 40); ctx.lineTo(18, 6); ctx.fill();
    ctx.restore();
  }
  ctx.restore();
  rain(t, 0.9);
  // xDrive torque HUD
  const ha = prog(t, 78.4, 78.9) * (1 - prog(t, 81.6, 82));
  if (ha > 0) {
    ctx.save(); ctx.globalAlpha = ha;
    const hx = 1500, hy = 760;
    ctx.fillStyle = 'rgba(5,10,12,0.75)'; ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath(); ctx.roundRect(hx, hy, 300, 220, 16); ctx.fill(); ctx.stroke();
    text('M xDRIVE · 4WD SPORT', hx + 150, hy + 36, { a: 'center', s: 18, w: 700, ls: 3, c: C.mute });
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(hx + 120, hy + 58, 60, 140, 14); ctx.stroke();
    const front = 0.3 + 0.18 * Math.sin(t * 2.6) + 0.06 * Math.sin(t * 7.1);
    [[hx + 98, hy + 72, front], [hx + 182, hy + 72, front], [hx + 98, hy + 150, 1 - front], [hx + 182, hy + 150, 1 - front]].forEach(([x, y, v]) => {
      ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fillRect(x, y, 20, 40);
      ctx.fillStyle = v > 0.55 ? C.mRed : C.mBlue; ctx.fillRect(x, y + 40 * (1 - v), 20, 40 * v);
    });
    text(`F ${Math.round(front * 100)}%`, hx + 30, hy + 98, { s: 20, w: 600, f: 'JetBrains Mono', c: C.mBlue });
    text(`R ${Math.round((1 - front) * 100)}%`, hx + 30, hy + 176, { s: 20, w: 600, f: 'JetBrains Mono', c: C.mRed });
    ctx.restore();
  }
  { const bg = ctx.createRadialGradient(560, 290, 0, 560, 290, 720); bg.addColorStop(0, 'rgba(0,0,0,0.6)'); bg.addColorStop(1, 'rgba(0,0,0,0)'); ctx.save(); ctx.scale(1, 0.45); ctx.translate(0, 290 / 0.45 - 290); ctx.fillStyle = bg; ctx.fillRect(0, 0, 1500, 900); ctx.restore(); }
  line('SATURDAY · A4069 BLACK MOUNTAIN PASS, WALES', 150, 210, t, 76.2, 81.6, { s: 26, w: 600, c: C.warm, f: 'JetBrains Mono', st: 0.02 });
  line('It’s raining. Obviously.', 150, 300, t, 76.6, 81.6, { s: 72, w: 800 });
  line('All-wheel drive finds the grip. Rear-wheel steering', 150, 360, t, 78.4, 81.6, { s: 34, w: 500, c: C.mute, st: 0.03 });
  line('tightens every hairpin.', 150, 400, t, 78.6, 81.6, { s: 34, w: 500, c: C.mute, st: 0.03 });
}
function sTouring(t) { // 82 – 85.5
  studio(t, true);
  const k = eIOC(prog(t, 83.0, 83.9));
  const S = 1.15, X = 960 - 500 * S, GY = 840;
  carWithReflection(X, GY, S, { k, lights: 1, sweep: prog(t, 83.6, 84.8) });
  flash(t, 83.4, 0.5, 0.35);
  line('SUNDAY · 10:30', 960, 190, t, 82.1, 85.1, { a: 'center', s: 26, w: 600, c: C.warm, f: 'JetBrains Mono', ls: 4 });
  line('The dog. The bikes. The tip run.', 960, 280, t, 82.25, 83.3, { a: 'center', s: 64, w: 800, out: 0.3 });
  line('There’s an M5 Touring for that.', 960, 280, t, 83.7, 85.1, { a: 'center', s: 64, w: 800, hl: { Touring: C.mBlue } });
}
function sBritain(t) {
  ctx.fillStyle = '#05070b'; ctx.fillRect(0, 0, W, H);
  chapterCard(t, 57.5, '04', 'A Day in Britain');
  if (t >= 59 && t < 64.5) sDawn(t);
  else if (t >= 64.5 && t < 71) sCommute(t);
  else if (t >= 71 && t < 76) sCharge(t);
  else if (t >= 76 && t < 82) sWales(t);
  else if (t >= 82) sTouring(t);
  if (t >= 59) {
    header(t, 59.1, 85.3, '04', 'A Day in Britain');
    const cuts = [59, 64.5, 71, 76, 82, 85.5];
    for (const c of cuts) black(1 - prog(Math.abs(t - c), 0, 0.22));
    clock(t, 59.2, 64.3, '06:40', 'TUESDAY');
    clock(t, 64.7, 70.8, '07:55', 'TUESDAY');
    clock(t, 71.2, 75.8, t < 73.8 ? '18:45' : '06:30', t < 73.8 ? 'TUESDAY' : 'WEDNESDAY');
    clock(t, 76.2, 81.8, '09:10', 'SATURDAY');
  }
}

// 7 — Why Britain (85.5 – 96)
function check(x, y, p) {
  ctx.save();
  ctx.strokeStyle = C.mBlue; ctx.lineWidth = 3; ctx.globalAlpha = clamp(p * 2);
  ctx.beginPath(); ctx.arc(x, y, 26, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * eOC(clamp(p * 1.6))); ctx.stroke();
  const q = clamp(p * 2 - 0.8);
  if (q > 0) {
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(x - 11, y + 1);
    const a = clamp(q * 2), b = clamp(q * 2 - 1);
    ctx.lineTo(x - 11 + 8 * a, y + 1 + 8 * a);
    if (b > 0) ctx.lineTo(x - 3 + 15 * b, y + 9 - 18 * b);
    ctx.stroke();
  }
  ctx.restore();
}
function sWhy(t) {
  ctx.fillStyle = '#05070b'; ctx.fillRect(0, 0, W, H);
  // drifting tricolour diagonals
  ctx.save(); ctx.globalAlpha = 0.07 * prog(t, 86.5, 87.5) * (1 - prog(t, 95.5, 96));
  ctx.translate(1500, 540); ctx.rotate(-0.35);
  [C.mBlue, C.mNavy, C.mRed].forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(-1200 + ((t * 60) % 400), -60 + i * 70 - 300, 3000, 46); });
  ctx.restore();
  chapterCard(t, 85.5, '05', 'Why It Works in Britain');
  header(t, 87.1, 96, '05', 'Why it works in Britain');
  const rows = [
    ['Up to 43 miles on electricity', 'Covers a typical commute there and back without using petrol'],
    ['37–39 g/km CO₂ (WLTP)', 'A far lower company-car tax band than any petrol-only M5'],
    ['ULEZ-compliant, silent in town', 'Glides through villages and city streets on electric power'],
    ['All-wheel drive for British weather', 'Rain, frost, wet leaves: M xDrive keeps it planted'],
    ['Right-hand drive, saloon or Touring', 'From around £110,000 at UK launch'],
  ];
  const fade = 1 - prog(t, 95.5, 96);
  ctx.save(); ctx.globalAlpha = fade;
  rows.forEach(([h, d], i) => {
    const t0 = 87.3 + i * 1.2, y = 270 + i * 150;
    if (t < t0) return;
    check(200, y - 14, prog(t, t0, t0 + 0.8));
    line(h, 260, y, t, t0 + 0.1, 99, { s: 48, w: 800, st: 0.04 });
    line(d, 260, y + 44, t, t0 + 0.3, 99, { s: 28, w: 500, c: C.mute, st: 0.02 });
  });
  ctx.restore();
}

// 8 — Outro (96 – 103)
function sOutro(t) {
  ctx.fillStyle = '#030406'; ctx.fillRect(0, 0, W, H);
  // distant city bokeh
  const r = rng(31);
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 60; i++) {
    const x = r() * W, y = 640 + r() * 120, rr = 6 + r() * 18, warm = r() < 0.6;
    const g = ctx.createRadialGradient(x, y, 0, x, y, rr);
    g.addColorStop(0, warm ? 'rgba(255,190,110,0.35)' : 'rgba(140,190,255,0.3)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(x - rr, y - rr, rr * 2, rr * 2);
  }
  ctx.restore();
  const fg = ctx.createLinearGradient(0, 800, 0, H); fg.addColorStop(0, '#0b0f15'); fg.addColorStop(1, '#010101');
  ctx.fillStyle = fg; ctx.fillRect(0, 812, W, H - 812);
  const S = 1.05, GY = 830, X0 = 960 - 500 * S;
  const go = eIC(prog(t, 97.0, 98.4));
  const x = X0 + go * 2600;
  // taillight trails
  if (go > 0) {
    const tx = x + 30 * S, ty = GY - 172 * S;
    const g = ctx.createLinearGradient(X0, 0, tx, 0);
    g.addColorStop(0, 'rgba(255,40,40,0)'); g.addColorStop(1, 'rgba(255,40,40,0.8)');
    ctx.save(); ctx.globalAlpha = 1 - prog(t, 99.3, 100.1); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.shadowColor = 'red'; ctx.shadowBlur = 20;
    ctx.fillRect(X0 - 200, ty - 4, tx - X0 + 200, 8); ctx.restore();
  }
  ctx.save(); ctx.globalAlpha = 1 - prog(t, 99.6, 100);
  carWithReflection(x, GY, S, { rot: go * 2600 / S / TYRE, lights: 1, blur: clamp(go * 3) });
  ctx.restore();
  speedLines(t, go * (1 - prog(t, 99, 100)), 17, 250, 850, 1);
  line('Electric on Monday.', 960, 440, t, 97.8, 99.8, { a: 'center', s: 96, w: 800, hl: { Electric: C.ev } });
  line('V8 on Saturday.', 960, 560, t, 98.5, 99.8, { a: 'center', s: 96, w: 800, hl: { V8: C.mRed } });
  // end card
  if (t > 100) {
    const p = eOC(prog(t, 100, 100.8));
    ctx.save(); ctx.globalAlpha = p;
    const g = ctx.createRadialGradient(960, 520, 0, 960, 520, 700);
    g.addColorStop(0, 'rgba(63,169,245,0.12)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.restore();
    line('BMW M5', 960, 560, t, 100.0, 120, { a: 'center', s: 180, w: 900, ls: -4, d: 0.8, st: 0.12 });
    tri(888, 600, 40, 10, prog(t, 100.4, 101.3));
    line('The super-saloon that plugs in.', 960, 700, t, 100.7, 120, { a: 'center', s: 44, w: 600, c: C.mute });
    line('Figures: BMW WLTP data and UK launch pricing. Real-world electric range varies. Independent film, not affiliated with or endorsed by BMW.', 960, 1030, t, 101.0, 120, { a: 'center', s: 18, w: 500, c: C.dim, st: 0.008, d: 0.4 });
  }
}

/* =====================================================================
   TIMELINE
   ===================================================================== */
function drawFrame(t) {
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0;
  if (t < 6.2) sCold(t);
  else if (t < 13.5) sTitle(t);
  else if (t < 28.5) sHistory(t);
  else if (t < 45) sAnatomy(t);
  else if (t < 57.5) sNumbers(t);
  else if (t < 85.5) sBritain(t);
  else if (t < 96) sWhy(t);
  else sOutro(t);
  // transitions: quick dip at major cuts, flash on the title hit
  for (const c of [13.5, 28.5, 45, 57.5, 85.5, 96]) black(1 - prog(Math.abs(t - c), 0, 0.2));
  flash(t, 6.2, 0.45, 0.6);
  flash(t, 45, 0.3, 0.4);
  flash(t, 100, 0.5, 0.25);
  vignette(0.6);
  grain(t, 0.045);
  black(prog(t, 102.3, 103));
  black(1 - prog(t, 0, 0.3));
  ctx.restore();
}
window.drawFrame = drawFrame;
window.DURATION = DURATION;

if (!location.hash.includes('render')) {
  const start = performance.now() - (parseFloat(new URLSearchParams(location.search).get('t')) || 0) * 1000;
  const loop = () => { drawFrame(((performance.now() - start) / 1000) % DURATION); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
